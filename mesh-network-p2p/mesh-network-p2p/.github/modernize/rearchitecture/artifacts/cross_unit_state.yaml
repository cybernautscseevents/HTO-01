flows:
  - name: session-display-name
    medium: session
    key: mesh_node_name
    writer:
      unit: mesh-console
      source_loc: src/pages/MeshConsole.jsx:156
    reader:
      unit: echolocate-radar
      source_loc: src/pages/EchoLocateView.jsx:10
